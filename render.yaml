services:
  - type: web
    name: pocket-mouse-store
    env: node
    region: oregon
    plan: free
    buildCommand: |
      npm ci --prefer-offline --no-audit --no-fund --loglevel=error
      rm -rf .next
      NODE_OPTIONS="--max-old-space-size=480" npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=480
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
